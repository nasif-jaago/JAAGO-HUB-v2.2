name: 🚀 JAAGO HUB Auto-Deploy (Simplified)

on:
  push:
    branches: [main]

env:
  PROJECT_PATH: /home/jfmaster/nextJs
  BACKUP_DIR: /home/jfmaster/backups
  LOG_DIR: /home/jfmaster/nextJs/log
  NODE_ENV: production
  LOG_LEVEL: info

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Build application
        run: npm run build:all

      - name: Validation checks
        run: |
          echo "🔍 Running validation checks..."
          npm run typecheck --workspaces || {
            echo "❌ Type checking failed!"
            exit 1
          }
          
          npm run lint --workspaces || {
            echo "❌ Linting failed!"
            exit 1
          }
          echo "✅ All validation checks passed"

      - name: Deploy to production VPS
        run: |
          echo "🚀 Starting deployment to production VPS..."
          echo "🏗️ Project path: ${{ env.PROJECT_PATH }}"
          echo "🔐 Using SSH port: ${{ secrets.VPS_PORT }}"
          
          ssh -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o PasswordAuthentication=yes \
              -o BatchMode=no \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              -p ${{ secrets.VPS_PORT }} "${{ secrets.VPS_PASSWORD }}" "
            set -euo pipefail
            
            cd "${{ env.PROJECT_PATH }}"
            rm -rf *
            
            git stash push -m "pre-deploy-$(date +%Y%m%d-%H%M%S)" || true
            
            cp -r /home/runner/work/JAAGO-HUB-v2.2/* .
            
            git stash pop 2>/dev/null || true
            
            npm ci --prefer-offline
            npm run build
            
            if supervisorctl restart hub-jaago; then
              echo "✅ Service restarted"
            else
              echo "ERROR: Failed to restart"
              exit 1
            fi
            
            echo "🎉 🎉 🎉 Production deployment completed!"

      - name: Emergency rollback
        if: failure()
        run: |
          echo "Starting EMERGENCY ROLLBACK..."
          
          ssh -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              -p ${{ secrets.VPS_PORT }} "${{ secrets.VPS_PASSWORD }}" "
            set -euo pipefail
            
            cd "${{ env.PROJECT_PATH }}"
            
            LATEST_BACKUP=$(ls -t "${{ env.BACKUP_DIR }}"/*.tar.gz 2>/dev/null | head -1)
            
            if [ -z "$LATEST_BACKUP" ]; then
              echo "ERROR: No backup to rollback to"
              exit 1
            fi
            
            echo "Rolling back to: $LATEST_BACKUP"
            
            supervisorctl stop hub-jaago
            
            rm -rf *
            tar -xzf "$LATEST_BACKUP"
            rm "$LATEST_BACKUP"
            
            npm ci --prefer-offline
            npm run build
            
            supervisorctl start hub-jaago
            
            echo "🎉 Emergency rollback completed!"
          " || {
            echo "❌ EMERGENCY ROLLBACK FAILED!"
            exit 1
          }
          
          echo "🔄 🚨 Emergency rollback completed!"