name: 🚀 JAAGO HUB Auto-Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Install deployment tools (sshpass & rsync)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync

      - name: Push updated files to VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          echo "🚀 Pushing updated files to VPS (/home/jfmaster/nextJs)..."
          rsync -avz --delete-after \
            -e "sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${{ secrets.VPS_PORT || '22' }}" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.turbo/' \
            --exclude='log/' \
            --exclude='*.log' \
            --exclude='.env*' \
            --exclude='backups/' \
            --exclude='*.tar.gz' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/jfmaster/nextJs/

      - name: Build and restart on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          echo "⚡ Connecting to VPS to install, build, and restart..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -p "${{ secrets.VPS_PORT || '22' }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
              set -e

              # Ensure Node & npm binaries are in PATH (including /opt/nvm and user NVM)
              export PATH=\"/opt/nvm/versions/node/v22.23.2/bin:\$PATH\"
              [ -s \"\$HOME/.nvm/nvm.sh\" ] && . \"\$HOME/.nvm/nvm.sh\" 2>/dev/null || true
              [ -s \"\$HOME/.bashrc\" ] && . \"\$HOME/.bashrc\" 2>/dev/null || true

              echo '📂 Navigating to /home/jfmaster/nextJs...'
              cd /home/jfmaster/nextJs

              echo '📥 Running npm install...'
              npm install

              echo '🏗️ Running npm run build...'
              npm run build

              echo '🔄 Restarting hub-jaago...'
              supervisorctl restart hub-jaago || sudo supervisorctl restart hub-jaago

              echo '🎉 Production deployment completed successfully!'
            "