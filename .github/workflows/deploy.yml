name: 🚀 JAAGO HUB Auto-Deploy

on:
  push:
    branches: [main]

env:
  PROJECT_PATH: /home/jfmaster/nextJs
  BACKUP_DIR: /home/jfmaster/backups

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Build application
        run: npm run build:all

      - name: Deploy to VPS
        run: |
          echo "Starting deployment..."
          echo "Project: ${{ env.PROJECT_PATH }}"
          
          ssh -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              -p ${{ secrets.VPS_PORT }} "
            set -euo pipefail
            
            cd "${{ env.PROJECT_PATH }}"
            rm -rf *
            
            git clone https://github.com/$(echo ${{ github.repository }} | cut -d'/' -f1,2)/${GITHUB_SHA}.tar.gz .
            
            git stash pop 2>/dev/null || true
            
            npm ci --prefer-offline
            npm run build
            
            if supervisorctl restart hub-jaago; then
              echo "✅ Service restarted"
            else
              echo "ERROR: Failed to restart"
              exit 1
            fi
            
            echo "🎉 Deployment completed successfully!"
          " || {
            echo "❌ DEPLOYMENT FAILED!"
            exit 1
          }
          
          echo "🎉 🎉 🎉 Production deployment completed!"

      - name: Emergency rollback
        if: failure()
        run: |
          echo "Starting EMERGENCY ROLLBACK..."
          
          ssh -o ConnectTimeout=30 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              -p ${{ secrets.VPS_PORT }} "
            set -euo pipefail
            
            cd "${{ env.PROJECT_PATH }}"
            
            LATEST_BACKUP=$(ls -t "${{ env.BACKUP_DIR }}"/*.tar.gz 2>/dev/null | head -1)
            
            if [ -z "$LATEST_BACKUP" ]; then
              echo "ERROR: No backup to rollback to"
              exit 1
            fi
            
            echo "Rolling back to: $LATEST_BACKUP"
            
            supervisorctl stop hub-jaago
            
            rm -rf *
            tar -xzf "$LATEST_BACKUP"
            rm "$LATEST_BACKUP"
            
            npm ci --prefer-offline
            npm run build
            
            supervisorctl start hub-jaago
            
            echo "🎉 Emergency rollback completed!"
          " || {
            echo "❌ EMERGENCY ROLLBACK FAILED!"
            exit 1
          }
          
          echo "🔄 🚨 Emergency rollback completed!"