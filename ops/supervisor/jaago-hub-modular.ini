; =================================================================
; JAAGO HUB v2.2 — Modular Supervisor Configuration (Per Subsystem)
; =================================================================

[program:jaago-web]
command=npm run start --workspace=@jaago/web
directory=/home/jfmaster/nextJs
user=root
autostart=true
autorestart=true
startretries=5
; Pass PORT from supervisor environment variable or override per instance (e.g. PORT="50001")
environment=NODE_ENV="production",PORT="%(ENV_PORT)s"
stdout_logfile=/home/jfmaster/nextJs/log/jaago-web.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/home/jfmaster/nextJs/log/jaago-web.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

[program:jaago-worker]
command=npm run start --workspace=@jaago/worker
directory=/home/jfmaster/nextJs
user=root
autostart=true
autorestart=true
startretries=5
environment=NODE_ENV="production"
stdout_logfile=/home/jfmaster/nextJs/log/jaago-worker.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/home/jfmaster/nextJs/log/jaago-worker.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

[program:jaago-log-runner]
command=npm run start --workspace=@jaago/log-runner
directory=/home/jfmaster/nextJs
user=root
autostart=true
autorestart=true
startretries=5
environment=NODE_ENV="production"
stdout_logfile=/home/jfmaster/nextJs/log/jaago-log-runner.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/home/jfmaster/nextJs/log/jaago-log-runner.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

[group:jaago]
programs=jaago-web,jaago-worker,jaago-log-runner
