; =================================================================
; JAAGO HUB v2.2 — Supervisor Process Controller Configuration
; Location on CentOS/RHEL:   /etc/supervisord.d/hub-jaago.ini
; Location on Ubuntu/Debian: /etc/supervisor/conf.d/hub-jaago.conf
; =================================================================

[program:hub-jaago]
command=/opt/nvm/versions/node/v22.23.2/bin/node index.js
directory=/home/jfmaster/nextJs
user=root
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stopwaitsecs=10

; Environment Variables
environment=NODE_ENV="production",PORT="50001",ENABLE_WEB="true",ENABLE_WORKER="true",ENABLE_LOG_RUNNER="true",PATH="/opt/nvm/versions/node/v22.23.2/bin:/usr/local/bin:/usr/bin:/bin:%(ENV_PATH)s"

; Standard Output & Error Logs saved to /home/jfmaster/nextJs/log
stdout_logfile=/home/jfmaster/nextJs/log/hub-jaago.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/home/jfmaster/nextJs/log/hub-jaago.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

redirect_stderr=false
