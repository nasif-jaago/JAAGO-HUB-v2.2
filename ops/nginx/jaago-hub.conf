# JAAGO HUB v2.2 — Hardened Nginx Reverse Proxy Configuration
# Production same-origin edge routing with TLS, strict headers, and rate limiting.

upstream jaago_web_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Rate limit zones (per client IP)
limit_req_zone $binary_remote_addr zone=jaago_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=jaago_auth_limit:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name jaagohub.jaago.com.bd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jaagohub.jaago.com.bd;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/jaagohub.jaago.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaagohub.jaago.com.bd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers (OWASP baseline)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;

    # Maximum payload size
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Health Checks (No rate limiting for orchestrators)
    location ~ ^/health/(live|ready)$ {
        proxy_pass http://jaago_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth routes rate limiting
    location /api/v1/auth/ {
        limit_req zone=jaago_auth_limit burst=10 nodelay;
        proxy_pass http://jaago_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Routes
    location /api/ {
        limit_req zone=jaago_api_limit burst=50 nodelay;
        proxy_pass http://jaago_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Assets & Web App
    location / {
        proxy_pass http://jaago_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
